# lines at most 120 wide; the author's own line breaks kept, only what is too long is wrapped: `scalafmt` at the root
version = "3.9.9"
runner.dialect = scala213source3
maxColumn = 120
newlines.source = keep
newlines.topLevelStatementBlankLines = []
newlines.beforeMultiline = keep
newlines.afterCurlyLambdaParams = keep
newlines.configStyleCallSite.prefer = false
newlines.configStyleDefnSite.prefer = false
newlines.inInterpolation = allow
binPack.preset = always
binPack.literalArgumentLists = true
align.preset = none
align.stripMargin = true
docstrings.style = keep
docstrings.wrap = no
docstrings.forceBlankLineBefore = false
rewrite.rules = []
indent.main = 2
indent.callSite = 2
indent.defnSite = 2
indent.extendSite = 2
danglingParentheses.preset = false
spaces.inImportCurlyBraces = false
fileOverride {
  "glob:**/scala-3/**" { runner.dialect = scala3 }
  "glob:**/impl-3/**" { runner.dialect = scala3 }
  "glob:**/examples/mixed/**" { runner.dialect = scala3 }
  "glob:**/interop/kyo/**" { runner.dialect = scala3 }
}
